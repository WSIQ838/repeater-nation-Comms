name: Build Repeater Nation Dispatch for Windows

# Manual only: run it from the Actions tab when a build is wanted.
# It publishes a GitHub release (dispatch-v<version>) with the installer attached.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Signs the one-click update package. Without this secret the build still works,
      # and the console falls back to opening the download link.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build Windows installer and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: dispatch-v__VERSION__
          releaseName: Repeater Nation Dispatch v__VERSION__
          releaseBody: |
            Windows installer for the Repeater Nation Dispatch console. Download the `x64-setup.exe` (or the `.msi`) and run it.
            Sign in with a Repeater Nation admin account.
            Windows may show "Windows protected your PC" because the app isn't signed: click **More info**, then **Run anyway**.
          releaseDraft: false
          prerelease: false
          includeDebug: false
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/updater.conf.json' || '' }}
      - name: Publish the update feed
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SIG=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe.sig | head -1)
          .github/scripts/update-feed.sh windows-x86_64 "$SIG" "https://github.com/${GITHUB_REPOSITORY}/releases/download/dispatch-v$VERSION/Repeater.Nation.Dispatch_${VERSION}_x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: repeater-nation-dispatch-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
