name: Build Repeater Nation Dispatch for Windows

# Manual only: run it from the Actions tab when a build is wanted.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build Windows installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: repeater-nation-dispatch-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
